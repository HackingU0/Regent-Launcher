# Push a tag like v0.1.0 (or run it by hand) to build every platform into a draft GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Regent Launcher v__VERSION__
          releaseDraft: true
          releaseBody: |
            Unsigned build (no paid certificate), so the OS asks once on first launch:
            - macOS: open the app once, then System Settings → Privacy & Security → "Open Anyway".
            - Windows: on "Windows protected your PC", click "More info" → "Run anyway".

            未签名版本，首次打开时系统会拦一次：
            - macOS：先打开一次，再到 系统设置 → 隐私与安全性 → 点"仍要打开"。
            - Windows：出现"Windows 已保护你的电脑"时，点"更多信息" → "仍要运行"。
          args: ${{ matrix.args }}
