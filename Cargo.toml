[package]
name = "regent-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
members = ["src-tauri"]
default-members = [".", "src-tauri"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "6.0.0"
anyhow = "1.0.105"
miniz_oxide = "0.9"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
